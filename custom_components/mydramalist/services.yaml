refresh:
  name: Refresh
  description: Force-refresh MyDramaList data from the API.
  target:
    entity:
      integration: mydramalist

search:
  name: Search
  description: Search for dramas or people on MyDramaList.
  fields:
    query:
      name: Query
      description: Search query string.
      required: true
      example: "goblin"
      selector:
        text:

get_drama:
  name: Get Drama
  description: Get detailed information about a specific drama.
  fields:
    title_id:
      name: Title ID
      description: The MyDramaList title id, or a slug that starts with it.
      required: true
      example: "18452-goblin"
      selector:
        text:
